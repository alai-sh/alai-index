# The user documentation at alai.sh/alai-index, built from docs/ with
# `uv run tox run -e docs`, which also writes the CLI reference and records the
# terminal recordings first.

[project]
site_name = "alai-index"
site_description = "Build and operate an alai index as a tree of files on disk."
site_url = "https://alai.sh/alai-index/"
repo_url = "https://github.com/alai-sh/alai-index"
repo_name = "alai-sh/alai-index"
copyright = "Copyright &copy; 2026 Jordan Borean"

nav = [
  { "Home" = "index.md" },
  { "The tree" = "the-tree.md" },
  { "Generating" = "generating.md" },
  { "Mirroring a Galaxy server" = "mirroring.md" },
  { "Publishing" = "publishing.md" },
  { "Running it from a program" = "scripting.md" },
  { "Shell completion" = "shell-completion.md" },
  { "Reference" = [
    { "Index format" = "index-format.md" },
    { "Plugin index" = "plugin-index.md" },
    { "CLI reference" = "cli.md" },
  ] },
  { "alai docs" = "https://docs.alai.sh/" },
]

# The terminal recordings, copied in by python -m cli_recorder assets.
extra_css = [
  "assets/cli-recorder/asciinema-player/asciinema-player.css",
  "assets/cli-recorder/cast.css",
  "assets/cli-recorder/ansi.css",
]
extra_javascript = [
  "assets/cli-recorder/asciinema-player/asciinema-player.min.js",
  "assets/cli-recorder/cast.js",
  # Opens code annotations on hover as well as on click.
  "assets/annotations.js",
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.code.annotate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Kept to plain Markdown plus callouts and highlighted code, so the content
# moves to another generator without rewriting.
[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}

# The Open Graph tags and a card image per page, for link previews.
[project.plugins.social]
